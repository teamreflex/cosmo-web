type Collection @entity {
  id: ID! # uuid, varchar(36)
  contract: String! @index
  createdAt: DateTime! @index
  slug: String! @index @unique
  # objekt fields
  collectionId: String!
  season: String! @index
  member: String! @index
  artist: String! @index
  collectionNo: String! @index
  class: String!
  thumbnailImage: String!
  frontImage: String!
  frontMedia: String # varchar(255)
  backImage: String!
  backgroundColor: String!
  textColor: String!
  accentColor: String!
  comoAmount: Int!
  onOffline: String! @index
  bandImageUrl: String # varchar(255)
  hasAudio: Boolean! # default false
  # hash of the mirrored source URL, null until mirrored into R2; varchar(12)
  frontImageVersion: String
  backImageVersion: String
  unobtainable: Boolean! # default false, set by staff
  transfers: [Transfer!] @derivedFrom(field: "collection")
  objekts: [Objekt!] @derivedFrom(field: "collection")
}

type Transfer @entity {
  id: ID! # uuid, varchar(36)
  from: String! @index
  to: String! @index
  timestamp: DateTime!
  tokenId: String!
  hash: String!
  objekt: Objekt! @index
  collection: Collection!
}

type Objekt @entity {
  id: ID! # token id
  owner: String! @index
  mintedAt: DateTime!
  receivedAt: DateTime!
  serial: Int! @index
  transferable: Boolean!
  transfers: [Transfer!] @derivedFrom(field: "objekt")
  collection: Collection! @index
}

type ComoBalance @entity {
  id: ID! # uuid, varchar(36)
  tokenId: Int! @index # COMO token id, one per artist; numeric column
  owner: String! @index
  amount: BigInt! @index
}

type Vote @entity {
  id: ID! # uuid, varchar(36)
  from: String! @index
  createdAt: DateTime! @index
  tokenId: Int! @index # COMO token id the vote spent
  pollId: Int! @index
  amount: BigInt! @index
  blockNumber: Int! @index
  logIndex: Int!
  hash: String!
  candidateId: Int # null until the poll's reveal
}

type ListEventOutbox @entity {
  id: ID! # bigserial, generated by Postgres on insert
  type: String! # transfer | transferability, varchar(16), default transfer
  transferId: String # transfer rows only, varchar(36)
  fromAddress: String # transfer rows only
  toAddress: String # transfer rows only
  transferable: Boolean # transferability rows only
  collectionId: String! # collection slug, varchar(36)
  tokenId: String!
  timestamp: DateTime!
  hash: String # transaction hash
  createdAt: DateTime! @index # default now()
}

type Member @entity {
  id: ID! # uuid, varchar(36)
  name: String! @unique # joins to collection.member
  cosmoId: Int!
  artistId: String!
  alias: String!
  units: JSON! # jsonb string array
  primaryColorHex: String!
  sortOrder: Int!
}

type CollectionStats @entity {
  collectionId: ID! # primary key, joins to objekt.collection_id and collection.id
  objektCount: Int!
  spunCount: Int!
}

type CollectionMarketStats @entity {
  collectionId: ID! # primary key, joins to collection.id
  floorUsd: Float! # real
  listingCount: Int!
  lastListedAt: DateTime!
}

type SerialReservation @entity {
  lo: Int! # primary key: the online token id just below the reserved range
  hi: Int! # the online token id just above it
}

type SerialConfirmation @entity {
  tokenId: ID! # primary key, joins to objekt.id
  serial: Int!
  confirmedBy: String # web user id, null when seeded from COSMO's own data
  confirmedAt: DateTime! # default now()
}
