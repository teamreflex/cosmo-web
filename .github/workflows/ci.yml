name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to a pull request replaces its run; every push to main keeps its own
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # web's lint type-checks against the compiled messages
      - run: bunx turbo i18n --ui stream
      - run: bunx turbo lint test --ui stream
